<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Красновишерск с высоты</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; background: #000000; 
            display: flex; justify-content: center; align-items: center;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, Roboto, sans-serif;
        }
        .btn-view {
            background: #2ed573; color: #ffffff; border: none; padding: 18px 36px;
            font-size: 20px; font-weight: 600; border-radius: 14px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); transition: transform 0.1s;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        .btn-view:active { transform: scale(0.95); }
    </style>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>

    <button class="btn-view" id="startBtn">Посмотреть панораму</button>

    <script>
        // Сразу инициируем мост ВК, чтобы приложение не падало
        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit');
        }

        document.getElementById('startBtn').addEventListener('click', function() {
            // Ссылка на эту же страницу, но с флагом, чтобы открыть саму панораму
            var targetUrl = window.location.href.split('#')[0].split('?')[0] + "?view=true" + window.location.hash;

            // Проверяем, это iOS?
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (isIOS && typeof vkBridge !== 'undefined') {
                // Если это Айфон и мы внутри ВК — принудительно открываем Сафари через ВК Мост
                vkBridge.send('VKWebAppOpenURL', { "url": targetUrl });
            } else {
                // Для Android, ПК и обычного Safari — просто перезагружаем страницу в режим плеера
                window.location.href = targetUrl;
            }
        });

        // А ТЕПЕРЬ МАГИЯ: если в ссылке есть ?view=true (то есть мы зашли из Сафари или с Андроида напрямую)
        // мы на лету стираем эту кнопку и встраиваем код плеера Pano2VR!
        if (window.location.search.indexOf('view=true') !== -1 || !/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            
            // Заменяем кнопку на чистый контейнер для панорамы
            document.body.innerHTML = '<div id="container" style="width:100%;height:100%;overflow:hidden;"><br>Loading...<br><br></div>';
            
            // Динамически подгружаем скрипты Pano2VR
            function loadScript(src, callback) {
                var s = document.createElement('script');
                s.src = src;
                s.onload = callback;
                document.head.appendChild(s);
            }

            loadScript('pano2vr_player.js?ts=40662407', function() {
                loadScript('skin.js?ts=40662407', function() {
                    loadScript('3rdparty/lottie/lottie.min.js', function() {
                        loadScript('browser.min.js', function() {
                            
                            // Запуск плеера, когда все скрипты на месте
                            var params = {};
                            var hash = window.location.hash.substring(1);
                            if (hash) { params.startNode = hash.split(',')[0]; }
                            
                            window.pano = new pano2vrPlayer("container");
                            if(params.startNode) window.pano.startNode = params.startNode;
                            window.pano.setQueryParameter("ts=40662407");
                            
                            window.skin = new pano2vrSkin(window.pano);
                            
                            setTimeout(function() {
                                window.pano.readConfigUrlAsync("pano.xml?ts=40662407");
                            }, 100);
                        });
                    });
                });
            });
        }
    </script>
</body>
</html>
