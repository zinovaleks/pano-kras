<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Красновишерск с высоты</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000000; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, Roboto, sans-serif;
        }
        
        /* Превращаем обычную ссылку в красивую зеленую кнопку */
        .btn-view {
            display: inline-block;
            background: #2ed573; 
            color: #ffffff; 
            text-decoration: none; /* Убираем подчеркивание ссылки */
            padding: 18px 36px;
            font-size: 20px; 
            font-weight: 600; 
            border-radius: 14px; 
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); 
            transition: transform 0.1s;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            text-align: center;
        }

        .btn-view:active { 
            transform: scale(0.95); 
        }
    </style>
</head>
<body>

    <!-- 
      Вместо тега button используем нативную ссылку.
      target="_blank" принудительно заставит iOS открыть её в браузере Safari.
    -->
    <a href="pano.html" target="_blank" class="btn-view">Посмотреть панораму</a>

</body>
</html>
