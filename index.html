<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Красновишерск с высоты</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000000; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        
        /* Стиль для кнопки */
        .btn-view {
            background: #2ed573; /* Приятный зеленый цвет */
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: transform 0.2s, background 0.2s;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }

        /* Эффект при нажатии */
        .btn-view:active {
            transform: scale(0.96);
            background: #26af5f;
        }
    </style>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>

    <button class="btn-view" id="startBtn">Посмотреть панораму</button>

    <script>
        // Инициализируем ВК сразу при входе, чтобы не было ошибок платформы
        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppInit')
                .then((data) => { if (data.result) console.log("VK Init OK"); })
                .catch((err) => { console.error("VK Init Error", err); });
        }

        // Обработчик клика на кнопку
        document.getElementById('startBtn').addEventListener('click', function() {
            // Перенаправляем пользователя на страницу с панорамой, сохраняя хэш нод
            window.location.replace("pano.html" + window.location.hash);
        });
    </script>
</body>
</html>
