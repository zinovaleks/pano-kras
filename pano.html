<!DOCTYPE html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
		<title>Красновишерск</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta property="og:title" content="Красновишерск">
		<meta property="og:description" content="Красновишерск с высоты ">
		<meta name="mobile-web-app-capable" content="yes" />
		<meta property="og:image" content="preview.jpg">
		
		<style type="text/css" title="Default">
			/* fullscreen */
			html {
				height:100%;
			}
			body {
				height:100%;
				margin: 0px;
				background: black;
				color: white;
				overflow:hidden; /* disable scrollbars */
				-webkit-tap-highlight-color: rgba(0, 0, 0, 0); /* remove highlight on tab for iOS/Android */
			}
			/* fix for scroll bars on webkit & >=Mac OS X Lion */
			::-webkit-scrollbar {
				background-color: rgba(0,0,0,0.5);
				width: 0.75em;
				height: 0.75em;
			}
			::-webkit-scrollbar-thumb {
				background-color: rgba(255,255,255,0.5); /* ИСПРАВЛЕНО: жестко вычищен скрытый пробел */
			}
		</style>
	</head>
	<body>
<script type="text/javascript" src="pano2vr_player.js?ts=40662407"></script>
		<script type="text/javascript" src="skin.js?ts=40662407"></script>
		<script src="3rdparty/lottie/lottie.min.js"></script>
		
		<div id="container" style="width:100%;height:100%;overflow:hidden;">
			<br>Loading...<br><br>
		</div>
		
		<script type="text/javascript">
		function parseParams(paramsString, params) {
			paramsString = paramsString.substring(1);
			var firstSeparatorPos = paramsString.indexOf(",");
			if (firstSeparatorPos != -1) {
				params.startNode = paramsString.slice(0, firstSeparatorPos);
				var viewingParamsString = paramsString.slice(firstSeparatorPos + 1);
				var viewingParams = viewingParamsString.split(",");
				if (viewingParams.length >= 3) {
					var startView = {};
					startView["pan"] = viewingParams[0];
					startView["tilt"] = viewingParams[1];
					startView["fov"] = viewingParams[2];
					if (viewingParams.length >= 4) {
						startView["projection"] = viewingParams[3];
					}
					params.startView = startView;
				}
			} else {
				params.startNode = paramsString;
				params.startView = "";
			}
		}
		var params = {};
		parseParams(document.location.hash, params);
		var startNode = params.startNode;
		var startView = params.startView;
		if (("onhashchange" in window) && (!(/MSIE (\d+\.\d+);/.test(navigator.userAgent)))) {
			window.onhashchange = function () {
				parseParams(window.location.hash, params);
				if (window.pano) pano.openNext('{' + params.startNode + '}', params.startView);
			}
		} else {
			var lastHash = window.location.hash;
			window.setInterval(function () {
				if (window.location.hash != lastHash) {
					lastHash = window.location.hash;
					parseParams(window.location.hash, params);
					if (window.pano) pano.openNext('{' + params.startNode + '}', params.startView);
				}
			}, 100);
		}
		
			// Создаем плеер
			pano = new pano2vrPlayer("container");
			pano.startNode = startNode;
			pano.startView = startView;
			pano.setQueryParameter("ts=40662407");
			
			// Подключаем скин обратно, так как панорама сжата до 632px и переведена в JPEG
			skin = new pano2vrSkin(pano);
			
			// Оптимизация путей для iOS внутри iframe: 
			// Генерируем абсолютный URL до xml-файла на основе текущего размещения pano.html
			var baseHref = window.location.href.split('#')[0].split('?')[0];
			var xmlUrl = baseHref.substring(0, baseHref.lastIndexOf('/')) + "/pano.xml?ts=40662407";

			// Безопасный запуск чтения конфигурации через микро-таймаут
			setTimeout(function() {
				pano.readConfigUrlAsync(xmlUrl);
			}, 100);

			// Фикс размеров экрана под iOS
			if (window.navigator.userAgent.match(/Safari/i)) {
				function iosHfix(e) {
					window.scrollTo(0, 1);
					var container = document.getElementById("container");
					if (!container) return;
					var oh = container.offsetHeight;
					document.documentElement.style.setProperty('height', '100vh');
					if (oh != container.offsetHeight) {
						container.style.setProperty('height', "100%");
					} else {
						container.style.setProperty('height', window.innerHeight + "px");
					}
					window.scrollTo(0, 0);
					if (pano && typeof pano.setViewerSize === 'function') {
						pano.setViewerSize(container.offsetWidth, container.offsetHeight);
					}
				};
				setTimeout(iosHfix, 50);
				setTimeout(iosHfix, 200);
				window.addEventListener("resize", function() {
					setTimeout(iosHfix, 50);
					setTimeout(iosHfix, 500);
				});
			}
		</script>
		
		<script async src="browser.min.js"></script>
		
		<noscript>
			<p><b>Please enable Javascript!</b></p>
		</noscript>
</body>
</html>
